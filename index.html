<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WebAR Video on Image Target</title>

  <!-- three.js 全局版 -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <!-- MindAR（稳定 1.1.4） -->
  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-three.prod.js"></script>

  <style>
    html, body { margin:0; padding:0; overflow:hidden; background:#111; }

    #ui{
      position:fixed; left:50%; top:50%;
      transform:translate(-50%,-50%);
      z-index:10; text-align:center; color:#fff;
      font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      width: 320px;
    }
    #btn{
      padding:14px 18px; font-size:16px;
      border-radius:12px; border:0;
      background:#fff; color:#111; cursor:pointer;
      width: 100%;
    }
    #status{
      margin-top:12px; font-size:14px;
      opacity:.9; white-space:pre-wrap;
      line-height: 1.4;
      text-shadow: 0 1px 3px rgba(0,0,0,.6);
    }

    /* 顶部提示条 */
    #toast{
      position:fixed;
      left:50%;
      top:16px;
      transform:translateX(-50%);
      padding:10px 14px;
      background:rgba(0,0,0,.65);
      color:#fff;
      border-radius:12px;
      z-index:9999;
      font-size:14px;
      display:none;
      pointer-events:none;
      white-space:nowrap;
      text-shadow: 0 1px 3px rgba(0,0,0,.6);
    }

    /* 如果手机端拦截播放，给一个“点我播放”按钮 */
    #tapPlay{
      position:fixed;
      left:50%;
      bottom:22px;
      transform:translateX(-50%);
      z-index:9999;
      padding:12px 16px;
      border-radius:12px;
      border:0;
      background:rgba(255,255,255,.92);
      color:#111;
      font-size:14px;
      display:none;
    }
  </style>
</head>

<body>
  <div id="ui">
    <button id="btn">点击开始扫描</button>
    <div id="status">状态：等待点击</div>
  </div>

  <div id="toast"></div>
  <button id="tapPlay">点我播放视频</button>

  <script>
    const btn = document.getElementById("btn");
    const statusEl = document.getElementById("status");
    const toastEl = document.getElementById("toast");
    const tapPlayBtn = document.getElementById("tapPlay");

    const setStatus = (s) => { statusEl.textContent = "状态：" + s; console.log(s); };

    let toastTimer = null;
    function showToast(text, ms = 1200) {
      toastEl.textContent = text;
      toastEl.style.display = "block";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.style.display = "none", ms);
    }

    // ✅ 你的目标图（做 mind 的那张）比例建议一致
    // 如果你的视频就是按目标图做的（竖图 1365x2048），用这个比例贴合会最准：
    const IMG_W = 1365;
    const IMG_H = 2048;
    const aspect = IMG_W / IMG_H;

    // 平面物理尺寸
    const W = 1.0;
    const H = W / aspect;

    // 视频路径（你按需修改）
    const VIDEO_SRC = "./assets/video.mp4";

    btn.onclick = async () => {
      btn.disabled = true;
      setStatus("已点击，正在启动 AR...");

      try {
        // 1) 创建 MindAR
        const mindarThree = new window.MINDAR.IMAGE.MindARThree({
          container: document.body,
          imageTargetSrc: "./targets/scene.mind",
        });

        const { renderer, scene, camera } = mindarThree;

        // 2) 创建 Anchor
        const anchor = mindarThree.addAnchor(0);

        // 3) 创建 video 元素（关键：iOS 必须 muted + playsinline）
        const video = document.createElement("video");
        video.src = VIDEO_SRC;
        video.loop = true;
        video.muted = true;           // ✅ 必须：否则手机基本不允许自动播放
        video.playsInline = true;     // ✅ iOS 必须
        video.setAttribute("playsinline", "");
        video.setAttribute("webkit-playsinline", "");
        video.preload = "auto";
        video.crossOrigin = "anonymous"; // 同域一般不需要，但加了更稳

        // 4) three.js 视频贴图
        const videoTexture = new THREE.VideoTexture(video);
        videoTexture.colorSpace = THREE.SRGBColorSpace;

        const geo = new THREE.PlaneGeometry(W, H);
        const mat = new THREE.MeshBasicMaterial({
          map: videoTexture,
          transparent: true,
          depthWrite: false,
        });

        const plane = new THREE.Mesh(geo, mat);
        anchor.group.add(plane);

        // 5) 扫描成功 / 丢失提示
        let targetVisible = false;

        anchor.onTargetFound = async () => {
          targetVisible = true;
          showToast("识别成功 ✅ 播放视频", 900);

          try {
            await video.play();
            tapPlayBtn.style.display = "none";
          } catch (e) {
            // 手机可能仍拦截（某些浏览器/设置）
            tapPlayBtn.style.display = "block";
            showToast("检测到拦截播放，请点底部按钮播放", 1400);
          }
        };

        anchor.onTargetLost = () => {
          targetVisible = false;
          showToast("目标丢失 ⚠️ 暂停视频", 900);
          video.pause();
          // 如果你想每次重新识别都从头播放，取消注释：
          // video.currentTime = 0;
          tapPlayBtn.style.display = "none";
        };

        // 如果被拦截，给用户一次点击强制播放（用户手势 100%解锁）
        tapPlayBtn.onclick = async () => {
          try {
            await video.play();
            tapPlayBtn.style.display = "none";
            showToast("已播放 ✅", 800);
          } catch (e) {
            showToast("仍无法播放，换 Chrome/Safari 试试", 1200);
          }
        };

        // 6) 启动 AR
        await mindarThree.start();
        setStatus("相机已启动 ✅ 请对准目标图");
        showToast("相机已启动，开始对准目标图…", 1200);
        document.getElementById("ui").style.display = "none";

        // 7) 预热：有些手机需要“先 play 一下再 pause”才能后续顺利播放
        // 这一步在用户点击开始后执行，属于用户手势链路，成功率更高
        try {
          await video.play();
          video.pause();
          video.currentTime = 0;
        } catch (e) {
          // 不影响后续识别后手动点播放
        }

        // 8) 渲染循环
        renderer.setAnimationLoop(() => {
          // 只有识别到才播放也行（这里不强制）
          renderer.render(scene, camera);
        });

      } catch (err) {
        console.error(err);
        setStatus("启动失败 ❌\n" + (err?.message || err));
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
