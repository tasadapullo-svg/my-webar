<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AR Video</title>

  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    #startBtn{
      position:fixed; left:50%; top:50%;
      transform:translate(-50%,-50%);
      padding:14px 18px; font-size:16px; z-index:9999;
    }
    #hint{
      position:fixed; left:50%; bottom:18px;
      transform:translateX(-50%);
      background:rgba(0,0,0,.60); color:#fff;
      padding:10px 14px; border-radius:10px;
      font-size:14px; z-index:9999;
      text-align:center; max-width: 90vw;
    }
    #err{
      display:none;
      position:fixed; left:50%; top:18px;
      transform:translateX(-50%);
      background:rgba(180,0,0,.75); color:#fff;
      padding:10px 14px; border-radius:10px;
      font-size:13px; z-index:10000;
      max-width: 90vw; white-space: pre-wrap;
    }
  </style>
</head>

<body style="margin:0; overflow:hidden; background:#000;">
  <div id="err"></div>
  <button id="startBtn">Tap to Start</button>
  <div id="hint">Tap to start, then point your camera at a target image.</div>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: targets.mind; maxTrack: 1;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
    renderer="colorManagement: true; physicallyCorrectLights: false;">

    <a-assets>
      <video id="arVideo"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline
        x5-playsinline
        x5-video-player-type="h5"
        x5-video-player-fullscreen="false"
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
  </a-scene>

  <script>
    const VIDEO_FILES = ["0.mp4","1.mp4","2.mp4","3.mp4","4.mp4","5.mp4","6.mp4","7.mp4","8.mp4","9.mp4"];

    const scene = document.getElementById('scene');
    const startBtn = document.getElementById('startBtn');
    const hint = document.getElementById('hint');
    const err = document.getElementById('err');
    const video = document.getElementById('arVideo');

    let started = false;
    let activeIndex = null;
    let switching = false;
    let lastSwitchAt = 0;
    const SWITCH_COOLDOWN_MS = 300; // 防抖，避免抖动时疯狂切换

    function showError(msg) {
      err.style.display = 'block';
      err.textContent = msg;
    }

    if (!window.isSecureContext) {
      showError("This page must be opened via HTTPS.\n(Use GitHub Pages HTTPS link)");
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showError("Camera is not supported in this browser.\nPlease open in Chrome/Safari.");
    }

    function pauseVideo() {
      try { video.pause(); } catch(e) {}
    }

    async function loadAndPlay(src) {
      return new Promise((resolve, reject) => {
        const onCanPlay = async () => {
          cleanup();
          try { video.currentTime = 0; } catch(e) {}
          try {
            const p = video.play();
            if (p && typeof p.then === "function") await p;
            resolve();
          } catch (e) {
            reject(e);
          }
        };

        const onError = () => {
          cleanup();
          reject(new Error("Video load error: " + src));
        };

        function cleanup() {
          video.removeEventListener('canplay', onCanPlay);
          video.removeEventListener('error', onError);
        }

        video.addEventListener('canplay', onCanPlay);
        video.addEventListener('error', onError);

        video.src = src;
        video.load();
      });
    }

    // 用户点击解锁播放权限
    startBtn.addEventListener('click', async () => {
      started = true;
      startBtn.style.display = 'none';
      hint.textContent = "Scanning… Point at a target image.";

      try {
        await loadAndPlay(VIDEO_FILES[0]); // 解锁
        pauseVideo();
      } catch (e) {
        showError("Cannot start video playback.\nTry another browser (Chrome/Safari).");
      }
    });

    async function switchTo(i) {
      const now = Date.now();
      if (now - lastSwitchAt < SWITCH_COOLDOWN_MS) return;
      lastSwitchAt = now;

      if (switching) return;
      if (activeIndex === i) return;

      switching = true;
      activeIndex = i;

      hint.textContent = `Detected target ${i + 1}. Loading…`;

      try {
        await loadAndPlay(VIDEO_FILES[i]);
        hint.textContent = `Playing target ${i + 1}.`;
      } catch (e) {
        showError("Video failed to play.\nIf you see a download prompt, re-encode MP4 (H.264 + faststart).");
      } finally {
        switching = false;
      }
    }

    function createTargets() {
      for (let i = 0; i < VIDEO_FILES.length; i++) {
        const target = document.createElement('a-entity');
        target.setAttribute('mindar-image-target', `targetIndex: ${i}`);

        const plane = document.createElement('a-plane');
        plane.setAttribute('width', '1');
        plane.setAttribute('height', '0.56');
        plane.setAttribute('material', 'shader: flat; src: #arVideo; transparent: true;');

        target.appendChild(plane);
        scene.appendChild(target);

        target.addEventListener('targetFound', async () => {
          if (!started) return;
          await switchTo(i);     // ✅ 找到就切换到该视频
        });

        target.addEventListener('targetLost', () => {
          // ✅ 不强制暂停：因为你可能马上扫到另一张
          // 如果你希望“丢失就暂停”，取消下面注释即可：
          // if (!started) return;
          // if (activeIndex === i) { pauseVideo(); activeIndex = null; hint.textContent = "Scanning…"; }
        });
      }
    }

    scene.addEventListener('loaded', () => createTargets());

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) pauseVideo();
    });
  </script>
</body>
</html>
