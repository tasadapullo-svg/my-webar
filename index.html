<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WebAR Video on Image Target</title>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-three.prod.js"></script>

  <style>
    html, body { margin:0; padding:0; overflow:hidden; background:#111; }

    #ui{
      position:fixed; left:50%; top:50%;
      transform:translate(-50%,-50%);
      z-index:10; text-align:center; color:#fff;
      font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      width: 320px;
    }
    #btn{
      padding:14px 18px; font-size:16px;
      border-radius:12px; border:0;
      background:#fff; color:#111; cursor:pointer;
      width: 100%;
    }
    #status{
      margin-top:12px; font-size:14px;
      opacity:.9; white-space:pre-wrap;
      line-height: 1.4;
      text-shadow: 0 1px 3px rgba(0,0,0,.6);
    }

    #toast{
      position:fixed;
      left:50%;
      top:16px;
      transform:translateX(-50%);
      padding:10px 14px;
      background:rgba(0,0,0,.65);
      color:#fff;
      border-radius:12px;
      z-index:9999;
      font-size:14px;
      display:none;
      pointer-events:none;
      white-space:nowrap;
      text-shadow: 0 1px 3px rgba(0,0,0,.6);
    }

    #tapPlay{
      position:fixed;
      left:50%;
      bottom:22px;
      transform:translateX(-50%);
      z-index:9999;
      padding:12px 16px;
      border-radius:12px;
      border:0;
      background:rgba(255,255,255,.92);
      color:#111;
      font-size:14px;
      display:none;
    }

    /* 调试面板：你确认OK后可删 */
    #debug{
      position:fixed;
      left:12px;
      bottom:12px;
      z-index:9999;
      background:rgba(0,0,0,.55);
      color:#fff;
      padding:8px 10px;
      border-radius:10px;
      font-size:12px;
      white-space:pre-wrap;
      line-height:1.35;
      opacity:.85;
      pointer-events:none;
      max-width: 70vw;
    }
  </style>
</head>

<body>
  <div id="ui">
    <button id="btn">点击开始扫描</button>
    <div id="status">状态：等待点击</div>
  </div>

  <div id="toast"></div>
  <button id="tapPlay">点我播放视频</button>
  <div id="debug">debug: 未开始</div>

  <script>
    const btn = document.getElementById("btn");
    const statusEl = document.getElementById("status");
    const toastEl = document.getElementById("toast");
    const tapPlayBtn = document.getElementById("tapPlay");
    const debugEl = document.getElementById("debug");

    const setStatus = (s) => { statusEl.textContent = "状态：" + s; console.log(s); };
    const setDebug = (s) => { debugEl.textContent = s; };

    let toastTimer = null;
    function showToast(text, ms = 1200) {
      toastEl.textContent = text;
      toastEl.style.display = "block";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.style.display = "none", ms);
    }

    // 目标图比例（与你编译 scene.mind 用的图一致）
    const IMG_W = 1365;
    const IMG_H = 2048;
    const aspect = IMG_W / IMG_H;

    const W = 1.0;
    const H = W / aspect;

    const VIDEO_SRC = "./assets/video.mp4";

    function isWeChat() {
      return /MicroMessenger/i.test(navigator.userAgent || "");
    }

    btn.onclick = async () => {
      btn.disabled = true;
      setStatus("已点击，正在启动 AR...");
      setDebug("debug: 启动中...");

      try {
        if (isWeChat()) {
          showToast("提示：微信内置浏览器可能限制视频/相机，建议用 Safari/Chrome 打开", 2200);
        }

        const mindarThree = new window.MINDAR.IMAGE.MindARThree({
          container: document.body,
          imageTargetSrc: "./targets/scene.mind",
        });

        const { renderer, scene, camera } = mindarThree;

        // 让 three 的颜色空间更一致
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        const anchor = mindarThree.addAnchor(0);

        // video 元素
        const video = document.createElement("video");
        video.src = VIDEO_SRC;
        video.loop = true;
        video.preload = "auto";
        video.crossOrigin = "anonymous";

        // ✅ 兼容关键项
        video.muted = true;
        video.setAttribute("muted", "");
        video.playsInline = true;
        video.setAttribute("playsinline", "");
        video.setAttribute("webkit-playsinline", "");

        // ✅ 挂到 DOM（更稳）
        video.style.position = "fixed";
        video.style.left = "-9999px";
        video.style.top = "-9999px";
        video.style.width = "1px";
        video.style.height = "1px";
        document.body.appendChild(video);

        video.addEventListener("error", () => {
          const err = video.error;
          setDebug("debug: video error = " + (err ? `${err.code}` : "unknown"));
          showToast("视频加载错误（检查路径/编码）", 1600);
        });

        video.load();

        // three.js VideoTexture
        const videoTexture = new THREE.VideoTexture(video);
        videoTexture.colorSpace = THREE.SRGBColorSpace;
        videoTexture.minFilter = THREE.LinearFilter;
        videoTexture.magFilter = THREE.LinearFilter;
        videoTexture.generateMipmaps = false;

        const geo = new THREE.PlaneGeometry(W, H);
        const mat = new THREE.MeshBasicMaterial({
          map: videoTexture,
          transparent: true,
          depthWrite: false,
          side: THREE.DoubleSide,
        });

        const plane = new THREE.Mesh(geo, mat);
        anchor.group.add(plane);

        let found = false;

        anchor.onTargetFound = () => {
          found = true;
          showToast("识别成功 ✅ 点击底部播放", 1200);
          tapPlayBtn.style.display = "block";
          setDebug("debug: target FOUND\nvideo.readyState=" + video.readyState);
        };

        anchor.onTargetLost = () => {
          found = false;
          showToast("目标丢失 ⚠️ 已暂停", 900);
          tapPlayBtn.style.display = "none";
          video.pause();
          video.currentTime = 0;
          setDebug("debug: target LOST\nvideo paused");
        };

        async function tryPlay() {
          // 只有识别到目标才允许播放
          if (!found) {
            showToast("请先对准目标图", 900);
            return;
          }

          try {
            // 一些浏览器要求先把 currentTime 设到 0 再 play
            if (video.readyState < 2) {
              // 还没到 HAVE_CURRENT_DATA
              setDebug("debug: 等待视频可播放...\nreadyState=" + video.readyState);
            }

            await video.play();
            tapPlayBtn.style.display = "none";
            showToast("播放中 ▶️", 900);
            setDebug("debug: play() OK ✅\npaused=" + video.paused + "\nreadyState=" + video.readyState);
          } catch (e) {
            console.error(e);
            // 把错误名显示出来（这才好定位）
            setDebug("debug: play() FAIL ❌\n" + (e && (e.name + ": " + e.message)));
            showToast("播放被拦截/失败：" + (e?.name || "unknown"), 1800);
            tapPlayBtn.style.display = "block";
          }
        }

        // ✅ 移动端更稳：同时绑定 touchstart + click
        tapPlayBtn.addEventListener("touchstart", (ev) => {
          ev.preventDefault();
          tryPlay();
        }, { passive: false });

        tapPlayBtn.addEventListener("click", (ev) => {
          ev.preventDefault();
          tryPlay();
        });

        await mindarThree.start();
        setStatus("相机已启动 ✅ 请对准目标图");
        showToast("相机已启动，开始对准目标图…", 1200);
        document.getElementById("ui").style.display = "none";
        setDebug("debug: camera started\n等待识别...");

        // ✅ 关键：强制每帧刷新 VideoTexture（解决“点了播放但画面不动”）
        renderer.setAnimationLoop(() => {
          if (!video.paused && video.readyState >= 2) {
            videoTexture.needsUpdate = true;
          }
          renderer.render(scene, camera);
        });

      } catch (err) {
        console.error(err);
        setStatus("启动失败 ❌\n" + (err?.message || err));
        setDebug("debug: 启动失败\n" + (err?.message || err));
        btn.disabled = false;
        showToast("启动失败 ❌", 1400);
      }
    };
  </script>
</body>
</html>
