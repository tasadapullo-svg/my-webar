<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AR Video</title>

  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    #startBtn{
      position:fixed;left:50%;top:50%;
      transform:translate(-50%,-50%);
      padding:14px 18px;font-size:16px;z-index:9999;
    }
    #hint{
      position:fixed;left:50%;bottom:18px;
      transform:translateX(-50%);
      background:rgba(0,0,0,.55);color:#fff;
      padding:8px 12px;border-radius:10px;
      font-size:14px;z-index:9999;
    }
    #dbg{
      position:fixed;left:10px;top:10px;
      background:rgba(0,0,0,.55);color:#fff;
      padding:6px 8px;border-radius:8px;
      font-size:12px;z-index:9999;
    }
  </style>
</head>

<body style="margin:0; overflow:hidden;">
  <button id="startBtn">Tap to Start</button>
  <div id="hint">Point your camera at the image — the video will play when detected.</div>
  <div id="dbg">t=0.00</div>

  <a-scene
    mindar-image="imageTargetSrc: targets.mind;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
    renderer="colorManagement: true; physicallyCorrectLights: false;">

    <a-assets>
      <video id="video"
        src="video.mp4"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous"></video>
    </a-assets>

    <a-entity id="marker" mindar-image-target="targetIndex: 0">
      <!-- 用 plane 贴 video texture（比 a-video 更稳） -->
      <a-plane id="screen"
        width="1"
        height="0.56"
        position="0 0 0"
        rotation="0 0 0"
        material="shader: flat; src: #video; transparent: true;">
      </a-plane>
    </a-entity>

    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
  </a-scene>

  <script>
    const startBtn = document.getElementById('startBtn');
    const hint = document.getElementById('hint');
    const dbg = document.getElementById('dbg');
    const video = document.getElementById('video');
    const marker = document.getElementById('marker');

    let started = false;

    async function forcePlay() {
      try { video.muted = true; } catch(e){}
      try { video.currentTime = 0; } catch(e){}
      try {
        const p = video.play();
        if (p && typeof p.then === 'function') await p;
      } catch (e) {}
    }

    // Debug：看 currentTime 是否增长
    setInterval(() => {
      dbg.textContent = `t=${(video.currentTime || 0).toFixed(2)}  ready=${video.readyState}`;
    }, 200);

    startBtn.addEventListener('click', async () => {
      started = true;
      startBtn.style.display = 'none';
      hint.textContent = 'Scanning… Point at the image.';
      // 用用户手势解锁播放权限
      await forcePlay();
      video.pause();
    });

    marker.addEventListener('targetFound', async () => {
      if (!started) return;
      hint.textContent = 'Detected! Playing…';
      await forcePlay();
    });

    marker.addEventListener('targetLost', () => {
      if (!started) return;
      video.pause();
      hint.textContent = 'Lost tracking — point at the image again.';
    });
  </script>
</body>
</html>
