<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WebAR 2.5D Parallax Demo</title>

  <!-- three.js 全局版（不需要 import） -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <!-- MindAR（three 版本，稳定的 1.1.4） -->
  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-three.prod.js"></script>

  <style>
    html, body { margin:0; padding:0; overflow:hidden; background:#111; }

    #ui{
      position:fixed; left:50%; top:50%;
      transform:translate(-50%,-50%);
      z-index:10; text-align:center; color:#fff;
      font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      width: 320px;
    }
    #btn{
      padding:14px 18px; font-size:16px;
      border-radius:12px; border:0;
      background:#fff; color:#111; cursor:pointer;
      width: 100%;
    }
    #status{
      margin-top:12px; font-size:14px;
      opacity:.9; white-space:pre-wrap;
      line-height: 1.4;
      text-shadow: 0 1px 3px rgba(0,0,0,.6);
    }
    #tip{
      margin-top:10px;
      font-size:12px;
      opacity:.7;
      line-height: 1.4;
    }

    /* 扫描成功提示条 */
    #toast{
      position:fixed;
      left:50%;
      top:16px;
      transform:translateX(-50%);
      padding:10px 14px;
      background:rgba(0,0,0,.65);
      color:#fff;
      border-radius:12px;
      z-index:9999;
      font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size:14px;
      line-height:1;
      display:none;
      pointer-events:none;
      text-shadow: 0 1px 3px rgba(0,0,0,.6);
      white-space:nowrap;
    }

    /* 可选：调试状态（你确认能识别后可以删掉） */
    #debug{
      position:fixed;
      left:12px;
      bottom:12px;
      padding:8px 10px;
      background:rgba(0,0,0,.55);
      color:#fff;
      border-radius:10px;
      z-index:9999;
      font-size:12px;
      font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      white-space:pre-wrap;
      opacity:.85;
      pointer-events:none;
    }
  </style>
</head>

<body>
  <div id="ui">
    <button id="btn">点击开始扫描</button>
    <div id="status">状态：等待点击</div>
    <div id="tip">
      请对准你编译 scene.mind 时用的那张目标图（建议裁掉天空/去掉大字更稳）
    </div>
  </div>

  <div id="toast"></div>
  <div id="debug">识别状态：未开始</div>

  <script>
    const btn = document.getElementById("btn");
    const statusEl = document.getElementById("status");
    const toastEl = document.getElementById("toast");
    const debugEl = document.getElementById("debug");

    const setStatus = (s) => { statusEl.textContent = "状态：" + s; console.log(s); };
    const setDebug = (s) => { debugEl.textContent = s; };

    // 顶部弹提示
    let toastTimer = null;
    function showToast(text, ms = 1200) {
      toastEl.textContent = text;
      toastEl.style.display = "block";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.style.display = "none";
      }, ms);
    }

    // 你的素材分辨率：1365 x 2048
    const IMG_W = 1365;
    const IMG_H = 2048;
    const aspect = IMG_W / IMG_H;  // 宽/高 ≈ 0.6665

    // 2.5D 平面物理宽度（单位任意，整体比例会跟着走）
    const W = 1.0;
    const H = W / aspect;

    // 全局引用（方便在动画里访问）
    let mindarThree, renderer, scene, camera;
    let anchor;
    let carMesh = null;
    let peopleMesh = null;

    setStatus("页面已加载，等待点击。");

    btn.onclick = async () => {
      btn.disabled = true;
      setStatus("已点击，正在启动 AR...");
      setDebug("识别状态：启动中...");

      try {
        mindarThree = new window.MINDAR.IMAGE.MindARThree({
          container: document.body,
          imageTargetSrc: "./targets/scene.mind",
        });

        ({ renderer, scene, camera } = mindarThree);

        // 识别到第 0 张 target 时显示内容
        anchor = mindarThree.addAnchor(0);

        // ✅ 扫描成功/丢失提示（你要的）
        anchor.onTargetFound = () => {
          console.log("✅ Found target");
          showToast("识别成功 ✅");
          setDebug("识别状态：✅ 已识别（target found）");
        };
        anchor.onTargetLost = () => {
          console.log("⚠️ Lost target");
          showToast("目标丢失 ⚠️", 900);
          setDebug("识别状态：⚠️ 已丢失（target lost）");
        };

        const loader = new THREE.TextureLoader();

        // 创建一层（透明叠层）
        function makeLayer(url, z, opts = {}) {
          const t = loader.load(url);
          t.colorSpace = THREE.SRGBColorSpace;

          const g = new THREE.PlaneGeometry(W, H);
          const m = new THREE.MeshBasicMaterial({
            map: t,
            transparent: true,
            depthWrite: false,
            ...opts,
          });

          const mesh = new THREE.Mesh(g, m);
          mesh.position.z = z;
          return mesh;
        }

        // ===== 4 层视差 =====
        const group = new THREE.Group();
        group.add(makeLayer("./assets/bg.png",   -0.10));
        group.add(makeLayer("./assets/mid.png",  -0.05));
        group.add(makeLayer("./assets/main.png",  0.00));
        group.add(makeLayer("./assets/fg.png",    0.06));

        // 如果你觉得整体偏大/偏小，在这里调 scale（0.9~1.1）
        // group.scale.set(0.98, 0.98, 0.98);

        anchor.group.add(group);

        // ===== 动态层：车 =====
        carMesh = makeLayer("./assets/cars.png", 0.02);
        anchor.group.add(carMesh);

        // ===== 动态层：人 =====
        peopleMesh = makeLayer("./assets/people.png", 0.04);
        anchor.group.add(peopleMesh);

        // 启动 AR
        await mindarThree.start();
        setStatus("AR 已启动 ✅ 请对准目标图");
        showToast("相机已启动，开始对准目标图…", 1400);
        setDebug("识别状态：相机已启动，等待识别…");

        document.getElementById("ui").style.display = "none";

        // ===== 动画循环 =====
        let t = 0;
        renderer.setAnimationLoop(() => {
          t += 0.02;

          if (carMesh) carMesh.position.x = Math.sin(t * 0.6) * 0.06;
          if (peopleMesh) peopleMesh.rotation.z = Math.sin(t) * 0.01;

          renderer.render(scene, camera);
        });

      } catch (err) {
        console.error(err);
        setStatus("启动失败 ❌\n" + (err?.message || err));
        setDebug("识别状态：启动失败\n" + (err?.message || err));
        btn.disabled = false;
        showToast("启动失败 ❌", 1500);
      }
    };
  </script>
</body>
</html>
