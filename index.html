<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AR Multi Videos (Debug)</title>

  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    #startBtn{
      position:fixed;left:50%;top:50%;
      transform:translate(-50%,-50%);
      padding:14px 18px;font-size:16px;z-index:9999;
    }
    #hint{
      position:fixed;left:50%;bottom:18px;
      transform:translateX(-50%);
      background:rgba(0,0,0,.60);color:#fff;
      padding:10px 14px;border-radius:10px;
      font-size:14px;z-index:9999;text-align:center;
      max-width: 92vw;
    }
    #dbg{
      position:fixed;left:10px;top:10px;z-index:10000;
      background:rgba(0,0,0,.65);color:#fff;
      padding:10px 12px;border-radius:10px;
      font-size:12px;line-height:1.35;
      max-width: 92vw;
      white-space: pre-wrap;
    }
  </style>
</head>

<body style="margin:0; overflow:hidden; background:#000;">
  <button id="startBtn">Tap to Start</button>
  <div id="hint">Tap to start, then point your camera at a target image.</div>
  <div id="dbg">loading…</div>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: targets.mind; maxTrack: 1;"
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:true"
    renderer="colorManagement:true; physicallyCorrectLights:false;">

    <a-assets>
      <video id="arVideo"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline
        x5-playsinline
        x5-video-player-type="h5"
        x5-video-player-fullscreen="false"
        crossorigin="anonymous"></video>
    </a-assets>

    <a-entity id="t0" mindar-image-target="targetIndex: 0"><a-plane width="1" height="1.5" material="shader: flat; src: #arVideo; transparent: true;"></a-plane></a-entity>
    <a-entity id="t1" mindar-image-target="targetIndex: 1"><a-plane width="1" height="1.5" material="shader: flat; src: #arVideo; transparent: true;"></a-plane></a-entity>
    <a-entity id="t2" mindar-image-target="targetIndex: 2"><a-plane width="1" height="1.5" material="shader: flat; src: #arVideo; transparent: true;"></a-plane></a-entity>
    <a-entity id="t3" mindar-image-target="targetIndex: 3"><a-plane width="1" height="1.5" material="shader: flat; src: #arVideo; transparent: true;"></a-plane></a-entity>
    <a-entity id="t4" mindar-image-target="targetIndex: 4"><a-plane width="1" height="1.5" material="shader: flat; src: #arVideo; transparent: true;"></a-plane></a-entity>
    <a-entity id="t5" mindar-image-target="targetIndex: 5"><a-plane width="1" height="1.5" material="shader: flat; src: #arVideo; transparent: true;"></a-plane></a-entity>
    <a-entity id="t6" mindar-image-target="targetIndex: 6"><a-plane width="1" height="1.5" material="shader: flat; src: #arVideo; transparent: true;"></a-plane></a-entity>
    <a-entity id="t7" mindar-image-target="targetIndex: 7"><a-plane width="1" height="1.5" material="shader: flat; src: #arVideo; transparent: true;"></a-plane></a-entity>
    <a-entity id="t8" mindar-image-target="targetIndex: 8"><a-plane width="1" height="1.5" material="shader: flat; src: #arVideo; transparent: true;"></a-plane></a-entity>
    <a-entity id="t9" mindar-image-target="targetIndex: 9"><a-plane width="1" height="1.5" material="shader: flat; src: #arVideo; transparent: true;"></a-plane></a-entity>
    <a-entity id="t10" mindar-image-target="targetIndex: 10"><a-plane width="1" height="1.5" material="shader: flat; src: #arVideo; transparent: true;"></a-plane></a-entity>
    <a-entity id="t11" mindar-image-target="targetIndex: 11"><a-plane width="1" height="1.5" material="shader: flat; src: #arVideo; transparent: true;"></a-plane></a-entity>

    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
  </a-scene>

  <script>
    const VIDEO_FILES = ["0.mp4","1.mp4","2.mp4","3.mp4","4.mp4","5.mp4","6.mp4","7.mp4","8.mp4","9.mp4","10.mp4","11.mp4"];

    const scene = document.getElementById('scene');
    const startBtn = document.getElementById('startBtn');
    const hint = document.getElementById('hint');
    const dbg = document.getElementById('dbg');
    const video = document.getElementById('arVideo');

    let started = false;
    let activeIndex = null;
    let switching = false;
    let foundCount = 0;

    let lastSwitchAt = 0;
    const SWITCH_COOLDOWN_MS = 800;

    function log(line){
      dbg.textContent = line;
    }

    function pauseVideo(){ try{ video.pause(); }catch(e){} }

    async function loadAndPlay(src){
      return new Promise((resolve, reject) => {
        const onCanPlay = async () => {
          cleanup();
          try { video.currentTime = 0; } catch(e) {}
          try {
            const p = video.play();
            if (p && typeof p.then === "function") await p;
            resolve();
          } catch(e) { reject(e); }
        };
        const onError = () => { cleanup(); reject(new Error("Video load error: " + src)); };

        function cleanup(){
          video.removeEventListener('canplay', onCanPlay);
          video.removeEventListener('error', onError);
        }

        video.addEventListener('canplay', onCanPlay);
        video.addEventListener('error', onError);

        video.src = src;
        video.load();
      });
    }

    // 检查 targets.mind 是否真的能加载
    async function checkTargetsMind(){
      try{
        const r = await fetch("targets.mind", {cache:"no-store"});
        if (!r.ok) throw new Error("HTTP " + r.status);
        const buf = await r.arrayBuffer();
        return buf.byteLength;
      }catch(e){
        return null;
      }
    }

    scene.addEventListener('loaded', async () => {
      const size = await checkTargetsMind();
      log(
`page loaded
HTTPS: ${location.protocol}
targets.mind bytes: ${size ?? "FAILED (404/blocked)"}
tap Start to begin`
      );
    });

    startBtn.addEventListener('click', async () => {
      started = true;
      startBtn.style.display = 'none';
      hint.textContent = "Scanning… Point at a target image.";

      try {
        await loadAndPlay(VIDEO_FILES[0]); // 解锁
        pauseVideo();
      } catch(e) {
        hint.textContent = "Video unlock failed. Try Chrome/Safari.";
      }
    });

    async function switchTo(i){
      const now = Date.now();
      if (now - lastSwitchAt < SWITCH_COOLDOWN_MS) return;
      lastSwitchAt = now;

      if (!started || switching) return;
      if (activeIndex === i) return;

      switching = true;
      activeIndex = i;

      hint.textContent = `FOUND target ${i+1}. Loading video…`;

      try {
        await loadAndPlay(VIDEO_FILES[i]);
        hint.textContent = `Playing target ${i+1} (${VIDEO_FILES[i]})`;
      } catch(e) {
        hint.textContent = `Play failed for ${VIDEO_FILES[i]}`;
      } finally {
        switching = false;
      }
    }

    for (let i=0;i<12;i++){
      const t = document.getElementById(`t${i}`);
      t.addEventListener('targetFound', () => {
        foundCount++;
        log(
`tracking…
foundCount: ${foundCount}
lastFound: targetIndex=${i}
activeIndex: ${activeIndex}
video: ${video.currentSrc ? video.currentSrc.split('/').slice(-1)[0] : "(none)"}
videoTime: ${(video.currentTime||0).toFixed(2)}
readyState: ${video.readyState}`
        );
        switchTo(i);
      });
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) pauseVideo();
    });
  </script>
</body>
</html>
