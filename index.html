<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WebAR Video on Image Target</title>

  <!-- three.js 全局版 -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <!-- MindAR（稳定 1.1.4） -->
  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.1.4/dist/mindar-image-three.prod.js"></script>

  <style>
    html, body { margin:0; padding:0; overflow:hidden; background:#111; }

    #ui{
      position:fixed; left:50%; top:50%;
      transform:translate(-50%,-50%);
      z-index:10; text-align:center; color:#fff;
      font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      width: 320px;
    }
    #btn{
      padding:14px 18px; font-size:16px;
      border-radius:12px; border:0;
      background:#fff; color:#111; cursor:pointer;
      width: 100%;
    }
    #status{
      margin-top:12px; font-size:14px;
      opacity:.9; white-space:pre-wrap;
      line-height: 1.4;
      text-shadow: 0 1px 3px rgba(0,0,0,.6);
    }

    /* 顶部提示条 */
    #toast{
      position:fixed;
      left:50%;
      top:16px;
      transform:translateX(-50%);
      padding:10px 14px;
      background:rgba(0,0,0,.65);
      color:#fff;
      border-radius:12px;
      z-index:9999;
      font-size:14px;
      display:none;
      pointer-events:none;
      white-space:nowrap;
      text-shadow: 0 1px 3px rgba(0,0,0,.6);
    }

    /* 播放按钮（用户点击后必播） */
    #tapPlay{
      position:fixed;
      left:50%;
      bottom:22px;
      transform:translateX(-50%);
      z-index:9999;
      padding:12px 16px;
      border-radius:12px;
      border:0;
      background:rgba(255,255,255,.92);
      color:#111;
      font-size:14px;
      display:none;
    }
  </style>
</head>

<body>
  <div id="ui">
    <button id="btn">点击开始扫描</button>
    <div id="status">状态：等待点击</div>
  </div>

  <div id="toast"></div>
  <button id="tapPlay">点我播放视频</button>

  <script>
    const btn = document.getElementById("btn");
    const statusEl = document.getElementById("status");
    const toastEl = document.getElementById("toast");
    const tapPlayBtn = document.getElementById("tapPlay");

    const setStatus = (s) => { statusEl.textContent = "状态：" + s; console.log(s); };

    let toastTimer = null;
    function showToast(text, ms = 1200) {
      toastEl.textContent = text;
      toastEl.style.display = "block";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.style.display = "none", ms);
    }

    // 目标图比例（与你编译 scene.mind 用的图保持一致）
    const IMG_W = 1365;
    const IMG_H = 2048;
    const aspect = IMG_W / IMG_H;

    // 平面物理尺寸
    const W = 1.0;
    const H = W / aspect;

    // 视频路径（确保线上能访问：/assets/video.mp4）
    const VIDEO_SRC = "./assets/video.mp4";

    btn.onclick = async () => {
      btn.disabled = true;
      setStatus("已点击，正在启动 AR...");

      try {
        // 1) 创建 MindAR
        const mindarThree = new window.MINDAR.IMAGE.MindARThree({
          container: document.body,
          imageTargetSrc: "./targets/scene.mind",
        });

        const { renderer, scene, camera } = mindarThree;

        // 2) 创建 Anchor
        const anchor = mindarThree.addAnchor(0);

        // 3) 创建 video（关键：muted + playsinline）
        const video = document.createElement("video");
        video.src = VIDEO_SRC;
        video.loop = true;
        video.preload = "auto";
        video.crossOrigin = "anonymous";

        // ✅ 手机端兼容关键项
        video.muted = true;
        video.setAttribute("muted", "");
        video.playsInline = true;
        video.setAttribute("playsinline", "");
        video.setAttribute("webkit-playsinline", "");

        // ✅ 挂到 DOM：部分机型更稳
        video.style.position = "fixed";
        video.style.left = "-9999px";
        video.style.top = "-9999px";
        video.style.width = "1px";
        video.style.height = "1px";
        document.body.appendChild(video);
        video.load();

        // 4) three.js 视频贴图
        const videoTexture = new THREE.VideoTexture(video);
        videoTexture.colorSpace = THREE.SRGBColorSpace;

        const geo = new THREE.PlaneGeometry(W, H);
        const mat = new THREE.MeshBasicMaterial({
          map: videoTexture,
          transparent: true,
          depthWrite: false,
        });

        const plane = new THREE.Mesh(geo, mat);
        anchor.group.add(plane);

        // ====== ✅ 核心：扫到不自动播，只出“播放按钮” ======
        let isFound = false;

        anchor.onTargetFound = () => {
          isFound = true;
          showToast("识别成功 ✅ 点击底部播放", 1200);
          tapPlayBtn.style.display = "block";
        };

        anchor.onTargetLost = () => {
          isFound = false;
          showToast("目标丢失 ⚠️ 已暂停", 900);
          tapPlayBtn.style.display = "none";
          video.pause();
          video.currentTime = 0; // 丢失后回到开头（你不想回到开头就删掉这行）
        };

        // 用户点击按钮播放（用户手势 = 100%允许）
        tapPlayBtn.onclick = async () => {
          if (!isFound) {
            showToast("请先对准目标图再播放", 1000);
            return;
          }
          try {
            await video.play();
            tapPlayBtn.style.display = "none";
            showToast("播放中 ▶️", 900);
          } catch (e) {
            console.error(e);
            showToast("无法播放：请换 Chrome/Safari 或检查设置", 1600);
          }
        };

        // 5) 启动 AR
        await mindarThree.start();
        setStatus("相机已启动 ✅ 请对准目标图");
        showToast("相机已启动，开始对准目标图…", 1200);
        document.getElementById("ui").style.display = "none";

        // 6) 渲染循环
        renderer.setAnimationLoop(() => {
          renderer.render(scene, camera);
        });

      } catch (err) {
        console.error(err);
        setStatus("启动失败 ❌\n" + (err?.message || err));
        btn.disabled = false;
        showToast("启动失败 ❌", 1400);
      }
    };
  </script>
</body>
</html>
