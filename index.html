<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AR Multi Videos (Stable Switch)</title>

  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    #startBtn{
      adaptation:none;
      position:fixed;left:50%;top:50%;
      transform:translate(-50%,-50%);
      padding:14px 18px;font-size:16px;z-index:9999;
      border-radius:12px;border:0;
    }
    #hint{
      position:fixed;left:50%;bottom:18px;
      transform:translateX(-50%);
      background:rgba(0,0,0,.60);color:#fff;
      padding:10px 14px;border-radius:10px;
      font-size:14px;z-index:9999;text-align:center;
      max-width: 92vw;
    }
    #dbg{
      position:fixed;left:10px;top:10px;z-index:10000;
      background:rgba(0,0,0,.65);color:#fff;
      padding:10px 12px;border-radius:10px;
      font-size:12px;line-height:1.35;
      max-width: 92vw;
      white-space: pre-wrap;
    }
  </style>
</head>

<body style="margin:0; overflow:hidden; background:#000;">
  <button id="startBtn">Tap to Start</button>
  <div id="hint">Tap to start, then point your camera at a target image.</div>
  <div id="dbg">loading…</div>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: targets.mind; maxTrack: 1;"
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:true"
    renderer="colorManagement:true; physicallyCorrectLights:false;"
  >
    <a-assets>
      <video id="arVideo"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline
        x5-playsinline
        x5-video-player-type="h5"
        x5-video-player-fullscreen="false"
        crossorigin="anonymous"></video>
    </a-assets>

    <!-- 12 targets -->
    <a-entity id="t0"  mindar-image-target="targetIndex: 0"><a-plane id="p0"  width="1" height="1.5" material="shader: flat; src: #arVideo;"></a-plane></a-entity>
    <a-entity id="t1"  mindar-image-target="targetIndex: 1"><a-plane id="p1"  width="1" height="1.5" material="shader: flat; src: #arVideo;"></a-plane></a-entity>
    <a-entity id="t2"  mindar-image-target="targetIndex: 2"><a-plane id="p2"  width="1" height="1.5" material="shader: flat; src: #arVideo;"></a-plane></a-entity>
    <a-entity id="t3"  mindar-image-target="targetIndex: 3"><a-plane id="p3"  width="1" height="1.5" material="shader: flat; src: #arVideo;"></a-plane></a-entity>
    <a-entity id="t4"  mindar-image-target="targetIndex: 4"><a-plane id="p4"  width="1" height="1.5" material="shader: flat; src: #arVideo;"></a-plane></a-entity>
    <a-entity id="t5"  mindar-image-target="targetIndex: 5"><a-plane id="p5"  width="1" height="1.5" material="shader: flat; src: #arVideo;"></a-plane></a-entity>
    <a-entity id="t6"  mindar-image-target="targetIndex: 6"><a-plane id="p6"  width="1" height="1.5" material="shader: flat; src: #arVideo;"></a-plane></a-entity>
    <a-entity id="t7"  mindar-image-target="targetIndex: 7"><a-plane id="p7"  width="1" height="1.5" material="shader: flat; src: #arVideo;"></a-plane></a-entity>
    <a-entity id="t8"  mindar-image-target="targetIndex: 8"><a-plane id="p8"  width="1" height="1.5" material="shader: flat; src: #arVideo;"></a-plane></a-entity>
    <a-entity id="t9"  mindar-image-target="targetIndex: 9"><a-plane id="p9"  width="1" height="1.5" material="shader: flat; src: #arVideo;"></a-plane></a-entity>
    <a-entity id="t10" mindar-image-target="targetIndex: 10"><a-plane id="p10" width="1" height="1.5" material="shader: flat; src: #arVideo;"></a-plane></a-entity>
    <a-entity id="t11" mindar-image-target="targetIndex: 11"><a-plane id="p11" width="1" height="1.5" material="shader: flat; src: #arVideo;"></a-plane></a-entity>

    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
  </a-scene>

  <script>
    const VIDEO_FILES = [
      "assets/0.mp4","assets/1.mp4","assets/2.mp4","assets/3.mp4",
      "assets/4.mp4","assets/5.mp4","assets/6.mp4","assets/7.mp4",
      "assets/8.mp4","assets/9.mp4","assets/10.mp4","assets/11.mp4"
    ];

    const startBtn = document.getElementById('startBtn');
    const hint = document.getElementById('hint');
    const dbg = document.getElementById('dbg');
    const video = document.getElementById('arVideo');

    // 把所有 plane 存起来，方便强制刷新材质
    const planes = [];
    for (let i=0;i<12;i++) planes.push(document.getElementById(`p${i}`));

    let started = false;
    let activeIndex = null;
    let switching = false;
    let foundCount = 0;

    // 更强防抖：必须稳定识别一段时间才切换
    let pendingIndex = null;
    let pendingTimer = null;
    const STABLE_MS = 250;           // 识别稳定 250ms 才切
    const SWITCH_COOLDOWN_MS = 1200; // 切换冷却
    let lastSwitchAt = 0;

    function log(line){ dbg.textContent = line; }
    function baseName(url){ try { return url.split('/').pop(); } catch(e){ return url; } }

    function refreshMaterial(){
      // A-Frame 有时不会立刻更新 video src，这里强制 material 重新绑定
      planes.forEach(p => {
        try {
          const m = p.getAttribute('material');
          // 重新 set 一次 material，触发更新
          p.setAttribute('material', { ...m, src: '#arVideo' });
        } catch(e) {}
      });
    }

    function pauseVideo(){
      try{ video.pause(); }catch(e){}
    }

    function loadAndPlay(src){
      return new Promise((resolve, reject) => {
        let done = false;

        const cleanup = () => {
          video.removeEventListener('loadeddata', onReady);
          video.removeEventListener('canplaythrough', onReady);
          video.removeEventListener('error', onError);
          clearTimeout(timeout);
        };

        const onReady = async () => {
          if (done) return;
          done = true;
          cleanup();
          try { video.currentTime = 0; } catch(e) {}
          refreshMaterial();
          try {
            const p = video.play();
            if (p && typeof p.then === "function") await p;
            resolve();
          } catch(e) { reject(e); }
        };

        const onError = () => {
          if (done) return;
          done = true;
          cleanup();
          reject(new Error("Video load error: " + src));
        };

        // 超时兜底（避免卡死）
        const timeout = setTimeout(() => {
          if (done) return;
          done = true;
          cleanup();
          reject(new Error("Video load timeout: " + src));
        }, 7000);

        video.addEventListener('loadeddata', onReady, {once:true});
        video.addEventListener('canplaythrough', onReady, {once:true});
        video.addEventListener('error', onError, {once:true});

        // 切换 src
        video.src = src + "?v=" + Date.now(); // 强制绕缓存
        video.load();
      });
    }

    // 解锁播放权限（必须在用户手势里）
    async function unlockVideo(){
      try{
        await loadAndPlay(VIDEO_FILES[0]);
        pauseVideo();
        try{ video.currentTime = 0; }catch(e){}
        hint.textContent = "Scanning… (video unlocked)";
      }catch(e){
        hint.textContent = "Video unlock failed. Try Chrome/Safari.";
      }
    }

    async function switchTo(i){
      const now = Date.now();
      if (now - lastSwitchAt < SWITCH_COOLDOWN_MS) return;
      if (!started || switching) return;
      if (activeIndex === i) return;

      switching = true;
      activeIndex = i;
      lastSwitchAt = now;

      const src = VIDEO_FILES[i];
      hint.textContent = `FOUND targetIndex=${i}. Loading ${baseName(src)}…`;

      try{
        await loadAndPlay(src);
        hint.textContent = `Playing targetIndex=${i} (${baseName(src)}) ✅`;
      }catch(e){
        hint.textContent = `Play failed for ${baseName(src)} ❌`;
      }finally{
        switching = false;
      }
    }

    function onTargetFound(i){
      foundCount++;
      log(
`tracking…
foundCount: ${foundCount}
lastFound: targetIndex=${i}
activeIndex: ${activeIndex}
video: ${video.currentSrc ? baseName(video.currentSrc) : "(none)"}
videoTime: ${(video.currentTime||0).toFixed(2)}
readyState: ${video.readyState}`
      );

      // 稳定识别后再切（解决抖动导致的“前一个”）
      pendingIndex = i;
      clearTimeout(pendingTimer);
      pendingTimer = setTimeout(() => {
        if (pendingIndex === i) switchTo(i);
      }, STABLE_MS);
    }

    // Start 按钮（touchstart 更稳）
    startBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      startBtn.click();
    }, {passive:false});

    startBtn.addEventListener('click', async () => {
      started = true;
      startBtn.style.display = 'none';
      hint.textContent = "Scanning… Point at a target image.";
      await unlockVideo();
    });

    // 绑定 12 个 targetFound / targetLost
    for (let i=0;i<12;i++){
      const t = document.getElementById(`t${i}`);
      t.addEventListener('targetFound', () => onTargetFound(i));
      t.addEventListener('targetLost', () => {
        // 丢失当前 target 就暂停，避免黑屏/卡在上一段
        if (activeIndex === i) {
          pauseVideo();
          try{ video.currentTime = 0; }catch(e){}
          hint.textContent = `Lost targetIndex=${i}.`;
        }
      });
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) pauseVideo();
    });
  </script>
</body>
</html>
