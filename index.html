<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AR Multi Videos</title>

  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    #startBtn{
      position:fixed; left:50%; top:50%;
      transform:translate(-50%,-50%);
      padding:14px 18px; font-size:16px; z-index:9999;
    }
    #hint{
      position:fixed; left:50%; bottom:18px;
      transform:translateX(-50%);
      background:rgba(0,0,0,.60); color:#fff;
      padding:10px 14px; border-radius:10px;
      font-size:14px; z-index:9999;
      text-align:center; max-width: 92vw;
    }
    #err{
      display:none;
      position:fixed; left:50%; top:18px;
      transform:translateX(-50%);
      background:rgba(180,0,0,.75); color:#fff;
      padding:10px 14px; border-radius:10px;
      font-size:13px; z-index:10000;
      max-width: 92vw; white-space: pre-wrap;
    }
    #picker{
      position:fixed; left:12px; bottom:72px;
      z-index:10001;
      background:rgba(0,0,0,.55);
      color:#fff; border-radius:10px;
      padding:8px 10px; font-size:13px;
    }
    #picker select{
      font-size:13px;
    }
  </style>
</head>

<body style="margin:0; overflow:hidden; background:#000;">
  <div id="err"></div>
  <button id="startBtn">Tap to Start</button>
  <div id="hint">Tap to start, then point your camera at a target image.</div>

  <!-- 可选：手动选择当前要扫哪一张（强烈推荐，最稳，不会扫错） -->
  <div id="picker" style="display:none;">
    Target:
    <select id="targetSelect"></select>
  </div>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: 0.mind; maxTrack: 1;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
    renderer="colorManagement: true; physicallyCorrectLights: false;">

    <a-assets>
      <video id="arVideo"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline
        x5-playsinline
        x5-video-player-type="h5"
        x5-video-player-fullscreen="false"
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-entity id="marker" mindar-image-target="targetIndex: 0">
      <a-plane id="screen"
        width="1"
        height="0.56"
        material="shader: flat; src: #arVideo; transparent: true;">
      </a-plane>
    </a-entity>

    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
  </a-scene>

  <script>
    // 你的文件：0.mind~9.mind 对应 0.mp4~9.mp4
    const PAIRS = Array.from({length: 10}, (_, i) => ({
      mind: `${i}.mind`,
      video: `${i}.mp4`,
      name: `Target ${i}`
    }));

    const scene = document.getElementById('scene');
    const startBtn = document.getElementById('startBtn');
    const hint = document.getElementById('hint');
    const err = document.getElementById('err');
    const video = document.getElementById('arVideo');

    const picker = document.getElementById('picker');
    const targetSelect = document.getElementById('targetSelect');

    let started = false;
    let current = 0;
    let switching = false;

    function showError(msg){
      err.style.display = 'block';
      err.textContent = msg;
    }

    function pauseVideo(){ try { video.pause(); } catch(e){} }

    async function loadAndPlayVideo(src){
      return new Promise((resolve, reject) => {
        const onCanPlay = async () => {
          cleanup();
          try { video.currentTime = 0; } catch(e){}
          try {
            const p = video.play();
            if (p && typeof p.then === 'function') await p;
            resolve();
          } catch(e) { reject(e); }
        };
        const onError = () => { cleanup(); reject(new Error("Video load error: " + src)); };

        function cleanup(){
          video.removeEventListener('canplay', onCanPlay);
          video.removeEventListener('error', onError);
        }

        video.addEventListener('canplay', onCanPlay);
        video.addEventListener('error', onError);

        video.src = src;
        video.load();
      });
    }

    // MindAR 切换 mind 文件时，需要重新初始化场景
    async function switchTarget(newIndex){
      if (switching) return;
      switching = true;

      pauseVideo();
      current = newIndex;

      hint.textContent = `Switched to ${PAIRS[current].name}. Point at the matching image.`;

      // 1) 停止当前 MindAR
      try {
        const sys = scene.systems["minda]()
